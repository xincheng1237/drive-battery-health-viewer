name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Universal app
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Run macOS tests
        working-directory: macos
        run: swift test --disable-sandbox

      - name: Build Universal app archive
        run: ./macos/scripts/build-universal.sh

      - name: Build DMG installer
        run: ./macos/scripts/build-dmg.sh

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Drive-Battery-Health-Viewer-macOS-Universal
          path: |
            macos/dist/*.zip
            macos/dist/*.dmg
          if-no-files-found: error
